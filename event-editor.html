<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thoáng Event Editor</title>
  <style>
    :root{--bg:#160c08;--panel:#21120d;--paper:#eadfd0;--gold:#c89a5b;--line:rgba(255,255,255,.15)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3e7d8;font-family:Arial,sans-serif;line-height:1.5}
    main{max-width:1120px;margin:auto;padding:35px 20px 70px}h1{font-family:Georgia,serif;font-size:46px;margin:0 0 8px}
    .help{color:#c8b7a7;max-width:850px}.layout{display:grid;grid-template-columns:1fr .85fr;gap:22px;margin-top:28px}
    .panel{background:var(--panel);border:1px solid var(--line);padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#d2aa77}
    input,textarea{width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);background:#160c08;color:white}
    textarea{resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    button{border:0;border-radius:999px;padding:12px 17px;font-weight:bold;cursor:pointer}.primary{background:#ead3ab;color:#24150f}.secondary{background:transparent;color:white;border:1px solid var(--line)}
    .event{display:grid;grid-template-columns:72px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
    .event img{width:72px;height:90px;object-fit:cover;background:#120907}.event h3{font-family:Georgia,serif;font-size:21px;margin:0}.event p{font-size:12px;color:#c7b7a8;margin:4px 0}
    .event button{padding:7px 10px;font-size:11px}.preview{width:100%;max-height:320px;object-fit:contain;background:#120907;margin-top:10px;display:none}
    .status{min-height:24px;margin-top:12px;color:#d8bb8e}.danger{color:#ffb8b8}
    @media(max-width:800px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
<main>
  <h1>Thoáng Event Editor</h1>
  <p class="help">Add or edit events, upload a poster, then click <b>Download events-data.js</b>. Replace the old <b>events-data.js</b> file in your website folder with the downloaded file and upload the website folder to Netlify again.</p>

  <div class="layout">
    <section class="panel">
      <h2>Add / Edit Event</h2>
      <input type="hidden" id="editIndex" value="">
      <div class="grid">
        <label>Vietnamese title<input id="titleVi" required></label>
        <label>English title<input id="titleEn"></label>
        <label>Date<input id="date" type="date" required></label>
        <label>Start time<input id="time" type="time" value="20:30" required></label>
        <label>End time<input id="endTime" type="time" value="22:30"></label>
        <label>Artists<input id="artists" placeholder="Piano • Guitar • Vocal"></label>
        <label class="full">Vietnamese description<textarea id="descriptionVi" rows="3"></textarea></label>
        <label class="full">English description<textarea id="descriptionEn" rows="3"></textarea></label>
        <label class="full">Poster image<input id="poster" type="file" accept="image/*"></label>
      </div>
      <img id="preview" class="preview" alt="Poster preview">
      <div class="actions">
        <button id="saveEvent" class="primary" type="button">Save event</button>
        <button id="clearForm" class="secondary" type="button">Clear form</button>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <h2>Current Events</h2>
      <div id="events"></div>
      <div class="actions">
        <button id="download" class="primary" type="button">Download events-data.js</button>
        <button id="importButton" class="secondary" type="button">Import existing file</button>
        <input id="importFile" type="file" accept=".js,.json" hidden>
      </div>
    </section>
  </div>
</main>

<script src="events-data.js"></script>
<script>
  let events = Array.isArray(window.THOANG_EVENTS) ? structuredClone(window.THOANG_EVENTS) : [];
  let posterData = '';
  const el = id => document.getElementById(id);

  function escapeHtml(text=''){return text.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
  function buildExportContent(items){
    return `/* Generated by Thoáng Event Editor */\nwindow.THOANG_EVENTS = ${JSON.stringify(items,null,2)};\n`;
  }
  function downloadText(filename, content){
    const blob=new Blob([content],{type:'text/javascript;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
  }
  function parseImportedEvents(text){
    const cleaned=text.replace(/\/\*[\s\S]*?\*\//g,'').trim();
    const match=cleaned.match(/window\.THOANG_EVENTS\s*=\s*(\[[\s\S]*\])\s*;?/);
    const source=match ? match[1] : cleaned;
    const parsed=Function(`return (${source});`)();
    if(!Array.isArray(parsed)) throw new Error('Invalid event data');
    return parsed;
  }
  function render(){
    const box=el('events'); box.innerHTML='';
    if(!events.length){box.innerHTML='<p>No events yet.</p>';return;}
    [...events].sort((a,b)=>a.date.localeCompare(b.date)).forEach(item=>{
      const index=events.indexOf(item);
      const row=document.createElement('div');row.className='event';
      row.innerHTML=`<img src="${item.poster || 'assets/event.jpg'}" alt=""><div><h3>${escapeHtml(item.titleVi)}</h3><p>${item.date} • ${item.time}${item.endTime?'–'+item.endTime:''}</p><p>${escapeHtml(item.artists||'')}</p></div><div><button class="secondary edit" data-index="${index}">Edit</button><button class="secondary remove danger" data-index="${index}">Delete</button></div>`;
      box.appendChild(row);
    });
    box.querySelectorAll('.edit').forEach(b=>b.addEventListener('click',()=>editEvent(Number(b.dataset.index))));
    box.querySelectorAll('.remove').forEach(b=>b.addEventListener('click',()=>{events.splice(Number(b.dataset.index),1);render();}));
  }

  function editEvent(index){
    const item=events[index]; el('editIndex').value=index;
    ['titleVi','titleEn','date','time','endTime','artists','descriptionVi','descriptionEn'].forEach(k=>el(k).value=item[k]||'');
    posterData=item.poster||'';
    if(posterData){el('preview').src=posterData;el('preview').style.display='block';}
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function clearForm(){
    el('editIndex').value=''; posterData=''; el('preview').style.display='none'; el('poster').value='';
    ['titleVi','titleEn','date','artists','descriptionVi','descriptionEn'].forEach(k=>el(k).value='');
    el('time').value='20:30';el('endTime').value='22:30';el('status').textContent='';
  }

  el('poster').addEventListener('change',e=>{
    const file=e.target.files[0];if(!file)return;
    if(file.size>2500000){el('status').textContent='Poster is large. Use an image under 2.5 MB for faster loading.';}
    const reader=new FileReader();reader.onload=()=>{posterData=reader.result;el('preview').src=posterData;el('preview').style.display='block';};reader.readAsDataURL(file);
  });

  el('saveEvent').addEventListener('click',()=>{
    if(!el('titleVi').value.trim()||!el('date').value||!el('time').value){el('status').textContent='Please enter Vietnamese title, date and start time.';return;}
    const item={id:'event-'+Date.now(),titleVi:el('titleVi').value.trim(),titleEn:el('titleEn').value.trim(),date:el('date').value,time:el('time').value,endTime:el('endTime').value,artists:el('artists').value.trim(),descriptionVi:el('descriptionVi').value.trim(),descriptionEn:el('descriptionEn').value.trim(),poster:posterData||'assets/event.jpg',bookingPhone:'+84523038686'};
    const index=el('editIndex').value;
    if(index==='') events.push(item); else {item.id=events[Number(index)].id||item.id;events[Number(index)]=item;}
    el('status').textContent='Event saved. Download the updated file when finished.';
    clearForm();render();
  });

  el('clearForm').addEventListener('click',clearForm);
  el('download').addEventListener('click',()=>{
    downloadText('events-data.js', buildExportContent(events));
  });

  el('importButton').addEventListener('click',()=>el('importFile').click());
  el('importFile').addEventListener('change',async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const text=await file.text();
      events=parseImportedEvents(text);render();el('status').textContent='Existing events imported.';
    }catch{el('status').textContent='Could not read that file.';}
  });
  render();
</script>
</body>
</html>
