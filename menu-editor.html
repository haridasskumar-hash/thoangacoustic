<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thoáng Menu Editor</title>
<style>
:root{--bg:#160c08;--panel:#21120d;--paper:#eadfd0;--line:rgba(255,255,255,.15)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3e7d8;font-family:Arial,sans-serif;line-height:1.5}main{max-width:1180px;margin:auto;padding:35px 20px 70px}h1{font-family:Georgia,serif;font-size:46px;margin:0 0 8px}.help{color:#c8b7a7;max-width:900px}.layout{display:grid;grid-template-columns:1fr .9fr;gap:22px;margin-top:28px}.panel{background:var(--panel);border:1px solid var(--line);padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#d2aa77}input,textarea,select{width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);background:#160c08;color:white}textarea{resize:vertical}.full{grid-column:1/-1}.check{display:flex;align-items:center;gap:9px;margin-top:12px;text-transform:none;color:white}.check input{width:auto;margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:999px;padding:12px 17px;font-weight:bold;cursor:pointer}.primary{background:#ead3ab;color:#24150f}.secondary{background:transparent;color:white;border:1px solid var(--line)}.item{display:grid;grid-template-columns:76px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}.item img{width:76px;height:86px;object-fit:cover;background:#120907}.item h3{font-family:Georgia,serif;font-size:20px;margin:0}.item p{font-size:12px;color:#c7b7a8;margin:3px 0}.item button{padding:7px 10px;font-size:11px}.preview{width:100%;max-height:320px;object-fit:contain;background:#120907;margin-top:10px;display:none}.status{min-height:24px;margin-top:12px;color:#d8bb8e}.danger{color:#ffb8b8}@media(max-width:820px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main>
<h1>Thoáng Menu Editor</h1>
<p class="help">Add drinks or food, upload an image, edit prices and categories, then save the updated <b>menu-data.js</b>. The editor will try to write straight to the file on your device; if your browser blocks that, it will download the file instead.</p>
<div class="layout"><section class="panel"><h2>Add / Edit Menu Item</h2><input type="hidden" id="editIndex">
<div class="grid">
<label>Vietnamese name<input id="nameVi" required></label><label>English name<input id="nameEn"></label>
<label>Vietnamese category<input id="categoryVi" placeholder="Cocktail"></label><label>English category<input id="categoryEn" placeholder="Cocktails"></label>
<label>Price<input id="price" placeholder="180,000₫"></label><label>Image<input id="image" type="file" accept="image/*"></label>
<label class="full">Vietnamese description<textarea id="descriptionVi" rows="3"></textarea></label>
<label class="full">English description<textarea id="descriptionEn" rows="3"></textarea></label>
</div><label class="check"><input id="available" type="checkbox" checked> Available now</label>
<img id="preview" class="preview" alt="Menu image preview"><div class="actions"><button id="save" class="primary" type="button">Save item</button><button id="clear" class="secondary" type="button">Clear form</button></div><p id="status" class="status" aria-live="polite"></p></section>
<section class="panel"><h2>Current Menu</h2><div id="items"></div><div class="actions"><button id="download" class="primary" type="button">Save menu-data.js</button><button id="importButton" class="secondary" type="button">Import existing file</button><input id="importFile" type="file" accept=".js,.json" hidden></div></section></div>
</main><script src="menu-data.js"></script><script>
let items=Array.isArray(window.THOANG_MENU)?structuredClone(window.THOANG_MENU):[];let imageData='';let saveFileHandle=null;const el=id=>document.getElementById(id);function esc(t=''){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function buildExportContent(itemsToExport){return '/* Generated by Thoáng Menu Editor */\nwindow.THOANG_MENU = '+JSON.stringify(itemsToExport,null,2)+';\n';}
async function persistMenuData(){const content=buildExportContent(items);try{if('showSaveFilePicker' in window){if(!saveFileHandle){saveFileHandle=await window.showSaveFilePicker({suggestedName:'menu-data.js',types:[{description:'JavaScript file',accept:{'text/javascript':['.js']}}]});}const writable=await saveFileHandle.createWritable();await writable.write(content);await writable.close();return true;}}catch(err){console.warn('Could not save directly to disk:',err);}const blob=new Blob([content],{type:'text/javascript'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='menu-data.js';a.click();URL.revokeObjectURL(url);return false;}
function render(){const box=el('items');box.innerHTML='';if(!items.length){box.innerHTML='<p>No menu items yet.</p>';return;}items.forEach((item,index)=>{const row=document.createElement('div');row.className='item';row.innerHTML=`<img src="${item.image||'assets/cocktail-1.jpg'}" alt=""><div><h3>${esc(item.nameVi||item.nameEn)}</h3><p>${esc(item.categoryVi||item.categoryEn)} • ${esc(item.price||'')}</p><p>${item.available===false?'Unavailable':'Available'}</p></div><div><button class="secondary edit" data-index="${index}">Edit</button><button class="secondary remove danger" data-index="${index}">Delete</button></div>`;box.appendChild(row)});box.querySelectorAll('.edit').forEach(b=>b.addEventListener('click',()=>edit(Number(b.dataset.index))));box.querySelectorAll('.remove').forEach(b=>b.addEventListener('click',()=>{items.splice(Number(b.dataset.index),1);render()}));}
function edit(index){const item=items[index];el('editIndex').value=index;['nameVi','nameEn','categoryVi','categoryEn','price','descriptionVi','descriptionEn'].forEach(k=>el(k).value=item[k]||'');el('available').checked=item.available!==false;imageData=item.image||'';if(imageData){el('preview').src=imageData;el('preview').style.display='block'}window.scrollTo({top:0,behavior:'smooth'});}
function clear(){el('editIndex').value='';imageData='';el('preview').style.display='none';el('image').value='';['nameVi','nameEn','categoryVi','categoryEn','price','descriptionVi','descriptionEn'].forEach(k=>el(k).value='');el('available').checked=true;}
el('image').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(f.size>2000000)el('status').textContent='Use an image below 2 MB for faster loading.';const r=new FileReader();r.onload=()=>{imageData=r.result;el('preview').src=imageData;el('preview').style.display='block'};r.readAsDataURL(f)});
el('save').addEventListener('click',async()=>{if(!el('nameVi').value.trim()){el('status').textContent='Please enter the Vietnamese item name.';return;}const item={id:'menu-'+Date.now(),categoryVi:el('categoryVi').value.trim()||'Khác',categoryEn:el('categoryEn').value.trim()||'Other',nameVi:el('nameVi').value.trim(),nameEn:el('nameEn').value.trim(),descriptionVi:el('descriptionVi').value.trim(),descriptionEn:el('descriptionEn').value.trim(),price:el('price').value.trim(),image:imageData||'assets/cocktail-1.jpg',available:el('available').checked};const i=el('editIndex').value;if(i==='')items.push(item);else{item.id=items[Number(i)].id||item.id;items[Number(i)]=item}clear();render();el('status').textContent='Menu item saved. Saving the data file…';try{const saved=await persistMenuData();el('status').textContent=saved?'Menu item saved and menu-data.js updated.':'Menu item saved. Downloaded menu-data.js.';}catch(err){el('status').textContent='Menu item saved, but the file could not be written.';console.error(err);}});el('clear').addEventListener('click',clear);
el('download').addEventListener('click',async()=>{try{const saved=await persistMenuData();el('status').textContent=saved?'Saved menu-data.js to your chosen file.':'Downloaded menu-data.js. Replace the old file in the website folder.';}catch(err){el('status').textContent='Could not save menu-data.js.';console.error(err);}});
el('importButton').addEventListener('click',()=>el('importFile').click());el('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const t=await f.text(),j=t.includes('window.THOANG_MENU')?t.slice(t.indexOf('['),t.lastIndexOf(']')+1):t,p=JSON.parse(j);if(!Array.isArray(p))throw Error();items=p;render();el('status').textContent='Existing menu imported.'}catch{el('status').textContent='Could not read that file.'}});render();
</script></body></html>
